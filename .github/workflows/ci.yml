name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    env:
      # A throwaway SQLite file: the build only needs the Prisma client and a URL to point at.
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
